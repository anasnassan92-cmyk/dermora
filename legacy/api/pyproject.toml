[project]
name = "dermora-api"
version = "0.1.0"
description = "Dermora backend – FastAPI API between the mobile app, Supabase and the AI provider."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Explicit, so a global ruff config on a teammate's machine cannot change CI results.
select = ["E4", "E7", "E9", "F", "I"]
