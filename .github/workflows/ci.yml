name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Server – typecheck + tests
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/server } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: apps/server/package-lock.json }
      - run: npm ci
      - run: npx tsc -p tsconfig.json --noEmit
      - run: npm test

  mobile:
    name: Mobile – typecheck
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: apps/mobile/package-lock.json }
      - run: npm ci
      - run: npm run typecheck

  web:
    name: Web – HTML check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test -f apps/web/index.html && ! grep -q "{{icon:" apps/web/index.html
      - name: questionnaire JSON identical in server and mobile
        run: cmp apps/server/src/data/questionnaire_v1.json apps/mobile/src/services/mock/questionnaire_v1.json
