name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API – pytest
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: apps/api/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check src tests
      - run: pytest -q

  mobile:
    name: Mobile – typecheck
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: apps/mobile/package-lock.json }
      - run: npm ci
      - run: npm run typecheck

  web:
    name: Web – HTML check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test -f apps/web/index.html && ! grep -q "{{icon:" apps/web/index.html
      - name: questionnaire JSON identical in api and mobile
        run: cmp apps/api/src/data/questionnaire_v1.json apps/mobile/src/services/mock/questionnaire_v1.json
